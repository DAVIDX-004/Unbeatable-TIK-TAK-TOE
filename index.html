<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="jungle-bg">
    <div class="sky"></div>
    <div class="sunbeam sunbeam-1"></div>
    <div class="sunbeam sunbeam-2"></div>
    <div class="sunbeam sunbeam-3"></div>
    <div class="vine vine-1"></div>
    <div class="vine vine-2"></div>
    <div class="vine vine-3"></div>
    <div class="vine vine-4"></div>
    <div class="leaf leaf-1"></div>
    <div class="leaf leaf-2"></div>
    <div class="leaf leaf-3"></div>
    <div class="leaf leaf-4"></div>
    <div class="leaf leaf-5"></div>
    <div class="leaf leaf-6"></div>
    <div class="mist"></div>
  </div>

  <div class="game-wrapper">
    <h1 class="game-title">JUNGLE&nbsp;TAC&nbsp;TOE</h1>

    <table>
      <tr>
        <td class="cell" id="0"></td>
        <td class="cell" id="1"></td>
        <td class="cell" id="2"></td>
      </tr>
      <tr>
        <td class="cell" id="3"></td>
        <td class="cell" id="4"></td>
        <td class="cell" id="5"></td>
      </tr>
      <tr>
        <td class="cell" id="6"></td>
        <td class="cell" id="7"></td>
        <td class="cell" id="8"></td>
      </tr>
    </table>

    <button class="replay-btn" onClick="startGame()">&#x27F2; REPLAY</button>
  </div>

  <div class="endgame">
    <div class="text"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
